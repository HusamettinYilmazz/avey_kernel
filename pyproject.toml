[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "avey-kernels"
version = "0.1.0"
description = "Experimental fused forward contextualizers for Avey and Avey-B"
requires-python = ">=3.10"
dependencies = ["torch>=2.6"]

[project.optional-dependencies]
cuda = ["triton>=3.2"]

[tool.setuptools.packages.find]
include = ["avey_kernels*"]
